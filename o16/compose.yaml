services:
  web:
    image: odoo:16.0
    command: -d o16_db 
    env_file: .env
    depends_on:
      - db
    ports:
      - "8016:8069"
    volumes:
      - ./odoo-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - ./custom_addons:/mnt/extra-addons
      - ./enterprise_addons:/mnt/enterprise-addons
    secrets:
      - postgresql_password
  db:
    image: postgres:15
    env_file: .env
    volumes:
      - ./odoo-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgresql_password
volumes:
  odoo-web-data:
  odoo-db-data:

secrets:
  postgresql_password:
    file: odoo_pg_pass
